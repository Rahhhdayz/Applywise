<!doctype html>
<html>
<body>
<form onsubmit="window.__submitted = true; return false;">
  <label>First Name <input type="text" name="firstName"></label>
  <label>Last Name <input type="text" name="lastName"></label>
  <label>Email <input type="email" name="email"></label>
  <label>LinkedIn URL <input type="text" name="urls[LinkedIn]"></label>
  <label>Resume <input type="file" name="resume" required></label>

  <fieldset>
    <legend>Are you willing to relocate?</legend>
    <label><input type="radio" name="relocate" value="yes"> Yes</label>
    <label><input type="radio" name="relocate" value="no"> No</label>
  </fieldset>

  <label>Additional Information <textarea name="comments"></textarea></label>

  <button type="submit">Submit</button>
</form>
</body>
</html>
