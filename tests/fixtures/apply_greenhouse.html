<!doctype html>
<html>
<body>
<form id="application-form" onsubmit="window.__submitted = true; return false;">
  <label for="first_name">First Name</label>
  <input type="text" id="first_name" name="first_name" required>

  <label for="last_name">Last Name</label>
  <input type="text" id="last_name" name="last_name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone">

  <label for="resume">Resume/CV</label>
  <input type="file" id="resume" name="resume" required>

  <fieldset>
    <legend>Are you authorized to work in the US?</legend>
    <label><input type="radio" name="authorized" value="yes"> Yes</label>
    <label><input type="radio" name="authorized" value="no"> No</label>
  </fieldset>

  <label for="how_heard">How did you hear about this position?</label>
  <select id="how_heard" name="how_heard">
    <option value="">Select...</option>
    <option value="website">Company website</option>
    <option value="referral">Referral</option>
  </select>

  <label for="cover_note">Why do you want to work here?</label>
  <textarea id="cover_note" name="cover_note"></textarea>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
