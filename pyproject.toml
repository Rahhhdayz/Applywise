[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobagent"
version = "0.1.0"
description = "Job-discovery and application-prep pipeline: deterministic Python, narrowly scoped AI, human-controlled submit."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rahul Sharma" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "playwright>=1.47",
    "pydantic>=2.0",
    "pypdf>=5.0",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "SQLAlchemy>=2.0",
    "python-jobspy>=1.1.82",
]

[project.urls]
Homepage = "https://github.com/Rahhhdayz/Applywise"
Repository = "https://github.com/Rahhhdayz/Applywise"
Issues = "https://github.com/Rahhhdayz/Applywise/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
